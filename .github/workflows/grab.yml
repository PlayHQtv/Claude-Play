name: grab-private
# Downloads every "<name> <url>" line in grab/request.txt on the runner and returns the files as a
# short-lived workflow ARTIFACT (retention 1 day). Nothing is committed to the public repo.
on:
  push:
    branches: [brand-assets]
    paths: [grab/request.txt]
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          while read -r name url; do [ -z "$name" ] && continue; curl -fsSL -A "Mozilla/5.0" -o "out/$name" "$url" && echo "ok $name"; done < grab/request.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: grab
          path: out
          retention-days: 1
