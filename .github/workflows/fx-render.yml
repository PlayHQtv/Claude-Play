name: fx-render
# Renders a PlayHQ FX video on the runner and uploads it straight to Cloudinary with signed params.
# Job file fx/jobs/<name>.json: {"src_url":..., "fx":{punches,kills,wanted}, "key_enc": b64(RSA-OAEP(aes key)), "upload_enc": b64(aes-256-cbc pbkdf2 of the sign-upload result)}
# The source clip and the result are never committed (third-party footage). Logs go to fx/logs/<name>.txt.
on:
  push:
    branches: [brand-assets]
    paths: ['fx/jobs/*.json']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
          pip install -q playwright pillow && python -m playwright install --with-deps chromium >/dev/null
      - name: Render + upload
        run: |
          mkdir -p fx/logs
          gh release download grab-private -p fx_key_v2.pem -D /tmp --clobber && mv /tmp/fx_key_v2.pem /tmp/fx_private.pem
          dec(){ case "$1" in enc:*) IFS=: read -r _ k d <<< "$1"; echo "$k" | base64 -d > /tmp/k.enc; openssl pkeyutl -decrypt -inkey /tmp/fx_private.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.enc -out /tmp/k.bin; echo "$d" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin;; *) printf %s "$1";; esac; }
          for job in $(git diff --name-only HEAD~1 HEAD -- 'fx/jobs/*.json'); do
            name=$(basename "$job" .json); log="fx/logs/$name.txt"
            {
              echo "job $name $(date -u)"
              jq '.fx' "$job" > /tmp/fx.json
              curl -fsSL -A "Mozilla/5.0" -o /tmp/src.mp4 "$(dec "$(jq -r .src_url "$job")")"
              ffprobe -v error -show_entries format=duration:stream=width,height -of compact /tmp/src.mp4
              python templates/video-fx/render_fx.py /tmp/src.mp4 /tmp/out.mp4 /tmp/fx.json
              ffprobe -v error -show_entries format=duration,size:stream=width,height -of compact /tmp/out.mp4
              ffmpeg -i /tmp/out.mp4 -af ebur128=framelog=quiet -f null - 2>&1 | grep -E " I:" | tail -1
              jq -r .key_enc "$job" | base64 -d > /tmp/k.enc
              openssl pkeyutl -decrypt -inkey /tmp/fx_private.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.enc -out /tmp/k.bin
              jq -r .upload_enc "$job" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/k.bin > /tmp/up.json
              host=$(jq -r .host /tmp/up.json); cloud=$(jq -r .cloud_name /tmp/up.json)
              args=(-F "file=@/tmp/out.mp4" -F "api_key=$(jq -r .api_key /tmp/up.json)" -F "signature=$(jq -r .signature /tmp/up.json)")
              for k in $(jq -r '.upload_params | keys[]' /tmp/up.json); do args+=(-F "$k=$(jq -r --arg k "$k" '.upload_params[$k]|tostring' /tmp/up.json)"); done
              curl -sS "https://$host/v1_1/$cloud/video/upload" "${args[@]}" | jq -c '{public_id,version,bytes,width,height,secure_url,error}'
            } > "$log" 2>&1 || echo "FAILED" >> "$log"
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx/logs && git commit -m "fx-render logs" && git push || true
