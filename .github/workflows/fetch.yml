name: fetch-media
# Downloads every URL listed in fetch/urls.txt ("<target path> <url>" per line) and commits the files.
on:
  push:
    branches: [brand-assets]
    paths: [fetch/urls.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          while read -r target url; do
            [ -z "$target" ] && continue
            case "$target" in \#*) continue;; esac
            mkdir -p "$(dirname "$target")"
            if curl -fsSL -A "Mozilla/5.0" -o "$target" "$url"; then
              echo "fetched $target ($(stat -c%s "$target") bytes)"
            else
              echo "FAILED $target"; rm -f "$target"
            fi
          done < fetch/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fetch
          git diff --cached --quiet || git commit -m "fetch-media: downloaded files"
          git push
