name: fx-keys
# One-time: creates an RSA key pair. Public key -> fx/pubkey.pem (committed). Private key -> asset of the
# DRAFT release "grab-private" (visible to repo collaborators only). Used to encrypt signed upload params
# (they contain account metadata) before they go into the public repo.
on:
  push:
    branches: [brand-assets]
    paths: [fx/keys.request]
permissions:
  contents: write
jobs:
  keys:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !github.event.forced }}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p fx
          {
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/fx_private.pem
          openssl pkey -in /tmp/fx_private.pem -pubout -out fx/pubkey.pem
          gh release list --limit 20 || true
          gh release upload grab-private /tmp/fx_private.pem /tmp/fx_key_v2.pem 2>/dev/null; cp /tmp/fx_private.pem /tmp/fx_key_v2.pem; gh release upload grab-private /tmp/fx_key_v2.pem
          echo "upload rc=$?"
          } > fx/keys.log 2>&1 || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx && git commit -m "fx public key" && git push
