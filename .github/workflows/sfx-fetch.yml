name: sfx-fetch
# Downloads CC0 sound packs (Kenney, via OpenGameArt) into assets/sfx/kenney/<pack>/ and writes INDEX.txt (name, duration).
on:
  push:
    branches: [brand-assets]
    paths: ['assets/sfx/packs.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !github.event.forced }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch packs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip >/dev/null
          mkdir -p assets/sfx/kenney assets/sfx/logs; log=assets/sfx/logs/fetch.txt; : > $log
          while read -r pack page; do
            [ -z "$pack" ] && continue; case "$pack" in \#*) continue;; esac
            echo "== $pack $page" >> $log
            html=$(curl -fsSL -A "Mozilla/5.0" "$page" || true)
            zip=$(echo "$html" | grep -oE 'https?://[^"]+\.zip' | head -1)
            [ -z "$zip" ] && zip=$(echo "$html" | grep -oE '/sites/default/files/[^"]+\.zip' | head -1 | sed 's#^#https://opengameart.org#')
            echo "zip: $zip" >> $log
            [ -z "$zip" ] && { echo "NO ZIP" >> $log; continue; }
            curl -fsSL -A "Mozilla/5.0" -o /tmp/p.zip "$zip" || { echo "DL FAILED" >> $log; continue; }
            rm -rf /tmp/p && mkdir /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
            mkdir -p "assets/sfx/kenney/$pack"
            find /tmp/p -iname 'license*' -exec cp {} "assets/sfx/kenney/$pack/" \; -quit
            find /tmp/p -type f \( -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' \) | while read -r f; do
              b=$(basename "$f"); b="${b%.*}"; b=$(echo "$b" | tr ' ' '_')
              ffmpeg -loglevel error -y -i "$f" -ac 2 -ar 48000 -c:a libvorbis -q:a 6 "assets/sfx/kenney/$pack/$b.ogg" || true
            done
          done < assets/sfx/packs.txt
          : > assets/sfx/kenney/INDEX.txt
          for f in $(find assets/sfx/kenney -name '*.ogg' | sort); do d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"); echo "${f#assets/sfx/kenney/} $d" >> assets/sfx/kenney/INDEX.txt; done
          wc -l assets/sfx/kenney/INDEX.txt >> $log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx && git commit -m "sfx-fetch: CC0 packs" && git push || true
