name: openverse-sfx
# Openverse API (no key needed): for every line "name | search query | max seconds" in assets/sfx/openverse.txt
# it takes the best CC0 audio hit, converts it to 48 kHz ogg in assets/sfx/openverse/<name>.ogg and writes the
# attribution to assets/sfx/openverse/CREDITS.txt. CC0 only -> free to use, commit is safe.
on:
  push:
    branches: [brand-assets]
    paths: ['assets/sfx/openverse.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !github.event.forced }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
      - name: Search + download
        run: |
          mkdir -p assets/sfx/openverse; C=assets/sfx/openverse/CREDITS.txt; touch $C
          while IFS='|' read -r name q max; do
            name=$(echo $name); q=$(echo $q); max=$(echo ${max:-4}); [ -z "$name" ] && continue; case "$name" in \#*) continue;; esac
            j=$(curl -fsS -G "https://api.openverse.org/v1/audio/" --data-urlencode "q=$q" -d license=cc0 -d page_size=20 < /dev/null) || { echo "fail $name"; continue; }
            hit=$(echo "$j" | jq -c --argjson m "$((max*1000))" '[.results[] | select(.duration != null and .duration <= $m and .duration > 150)] | first // empty')
            [ -z "$hit" ] && { echo "no hit $name"; continue; }
            url=$(echo "$hit" | jq -r '.url'); alt=$(echo "$hit" | jq -r '.alt_files[0].url // empty')
            curl -fsSL -A "Mozilla/5.0" -o /tmp/a "$url" < /dev/null || curl -fsSL -A "Mozilla/5.0" -o /tmp/a "$alt" < /dev/null || { echo "dl fail $name"; continue; }
            ffmpeg -nostdin -loglevel error -y -i /tmp/a -ac 2 -ar 48000 -af "loudnorm=I=-16:TP=-3" -c:a libvorbis -q:a 6 "assets/sfx/openverse/$name.ogg" && \
              { grep -v "^$name " $C > /tmp/c || true; mv /tmp/c $C; echo "$name $(echo "$hit" | jq -r '.attribution')" >> $C; echo "ok $name"; }
          done < assets/sfx/openverse.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/openverse && git commit -qm "openverse-sfx: CC0 sounds" && git push || true
