name: cache-push
# Private asset cache: a push of bundle/cache/ (cache_key.enc + cache_partNN, encrypted with fx/pubkey.pem, each < 100 MB)
# to a NEW branch "tmp-cache-*" replaces the cache assets of the draft release "grab-private"; the branch deletes itself.
on:
  push:
    branches: ['tmp-cache-*']
    paths: ['bundle/cache/**', 'bundle/cache.tar']
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    if: ${{ !github.event.forced }}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -d bundle/cache ]; then
            for a in $(gh release view grab-private --json assets -q '.assets[].name' | grep -E '^cache_part[0-9]+$|^cache_key.enc$|^cache.tar$'); do gh release delete-asset grab-private "$a" -y; done
            gh release upload grab-private bundle/cache/* --clobber
          else
            gh release upload grab-private bundle/cache.tar --clobber
          fi
          git push origin --delete "$GITHUB_REF_NAME"
