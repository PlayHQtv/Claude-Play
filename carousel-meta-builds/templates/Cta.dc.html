<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call to Action</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Oswald:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#e8c25a}a:hover{color:#ffffff}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 1080px; height: 1920px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 45%, #1d1a12 0%, #0a0a0a 65%); font-family: Oswald, Arial, sans-serif; color: #ffffff; padding: 110px 56px 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
<div style="position: absolute; left: 28px; top: 28px; width: 80px; height: 80px; border-left: 3px solid {{accent}}; border-top: 3px solid {{accent}}"></div>
<div style="position: absolute; right: 28px; top: 28px; width: 80px; height: 80px; border-right: 3px solid {{accent}}; border-top: 3px solid {{accent}}"></div>
<div style="position: absolute; left: 28px; bottom: 28px; width: 80px; height: 80px; border-left: 3px solid {{accent}}; border-bottom: 3px solid {{accent}}"></div>
<div style="position: absolute; right: 28px; bottom: 28px; width: 80px; height: 80px; border-right: 3px solid {{accent}}; border-bottom: 3px solid {{accent}}"></div>
<div style="position: absolute; left: -180px; bottom: 380px; width: 680px; height: 680px; border-radius: 50%; background: radial-gradient(circle, rgba(232,194,90,0.30) 0%, rgba(232,194,90,0) 70%)"></div>
<div style="position: absolute; right: -200px; top: 760px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(166,120,24,0.30) 0%, rgba(166,120,24,0) 70%)"></div>
<div style="position: absolute; left: -120px; top: 520px; width: 560px; height: 3px; background: {{accent}}; opacity: 0.5; transform: rotate(-38deg)"></div>
<div style="position: absolute; right: -150px; bottom: 420px; width: 600px; height: 3px; background: {{accent}}; opacity: 0.5; transform: rotate(-38deg)"></div>
<div style="position: relative; display: flex; justify-content: flex-end; align-items: center; gap: 12px">
<svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M3 3 L31 19 L3 35 Z" fill="none" stroke="{{accent}}" stroke-width="5" stroke-linejoin="round"></path></svg>
<span style="font-family: Anton, Impact, sans-serif; font-size: 40px; letter-spacing: 2px">PLAY<span style="color: {{accent}}">HQ</span></span>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
<div style="font-family: Anton, Impact, sans-serif; font-size: 160px; line-height: 0.98">WHICH ONE</div>
<div style="font-family: Anton, Impact, sans-serif; font-size: 160px; line-height: 0.98; background: linear-gradient(180deg, #fff1b8 0%, #e8c25a 45%, #a67818 100%); -webkit-background-clip: text; background-clip: text; color: transparent">IS YOUR MAIN?</div>
<div style="font-size: 44px; font-weight: 700; letter-spacing: 8px; color: #cfcfcf; margin-top: 16px">DROP THE NUMBER IN THE COMMENTS</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{picks}}" as="w" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 28px; border-radius: 24px; background: linear-gradient(145deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.03) 100%); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,241,184,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), 0 12px 32px rgba(0,0,0,0.45); padding: 18px 26px">
<span style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 18px; background: linear-gradient(160deg, #fff1b8 0%, #e8c25a 45%, #a67818 100%); display: flex; align-items: center; justify-content: center; font-family: Anton, Impact, sans-serif; font-size: 58px; color: #0a0a0a">{{w.n}}</span>
<span style="font-family: Anton, Impact, sans-serif; font-size: 58px; letter-spacing: 1px">{{w.name}}</span>
</div>
</sc-for>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<div style="font-family: Anton, Impact, sans-serif; font-size: 72px; line-height: 1">FOLLOW <span style="color: {{accent}}">@PLAYHQTV</span></div>
<div style="font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #cfcfcf">FOR DAILY MW4 META</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e8c25a"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#e8c25a',
picks: [
{ n: '1', name: 'HYEON BURST' },
{ n: '2', name: 'HAN 86' },
{ n: '3', name: 'KASTOV 762' },
{ n: '4', name: 'ISO NIGHTSHADE' }
]
};
}
}
</script>
</body>
</html>
