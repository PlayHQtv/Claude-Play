<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover Top 5 Meta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Oswald:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#e8c25a}a:hover{color:#ffffff}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 1080px; height: 1920px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 45%, #1d1a12 0%, #0a0a0a 65%); font-family: Oswald, Arial, sans-serif; color: #ffffff; padding: 110px 56px 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
<div style="position: absolute; left: 28px; top: 28px; width: 80px; height: 80px; border-left: 3px solid {{accent}}; border-top: 3px solid {{accent}}"></div>
<div style="position: absolute; right: 28px; top: 28px; width: 80px; height: 80px; border-right: 3px solid {{accent}}; border-top: 3px solid {{accent}}"></div>
<div style="position: absolute; left: 28px; bottom: 28px; width: 80px; height: 80px; border-left: 3px solid {{accent}}; border-bottom: 3px solid {{accent}}"></div>
<div style="position: absolute; right: 28px; bottom: 28px; width: 80px; height: 80px; border-right: 3px solid {{accent}}; border-bottom: 3px solid {{accent}}"></div>
<div style="position: absolute; left: -180px; bottom: 260px; width: 680px; height: 680px; border-radius: 50%; background: radial-gradient(circle, rgba(232,194,90,0.30) 0%, rgba(232,194,90,0) 70%)"></div>
<div style="position: absolute; right: -200px; bottom: 620px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(166,120,24,0.30) 0%, rgba(166,120,24,0) 70%)"></div>
<div style="position: absolute; left: -120px; top: 420px; width: 560px; height: 3px; background: {{accent}}; opacity: 0.5; transform: rotate(-38deg)"></div>
<div style="position: absolute; right: -150px; bottom: 520px; width: 600px; height: 3px; background: {{accent}}; opacity: 0.5; transform: rotate(-38deg)"></div>
<div style="position: relative; display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #b9b9b9">CALL OF DUTY · MW4</div>
<div style="display: flex; align-items: center; gap: 12px">
<svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M3 3 L31 19 L3 35 Z" fill="none" stroke="{{accent}}" stroke-width="5" stroke-linejoin="round"></path></svg>
<span style="font-family: Anton, Impact, sans-serif; font-size: 40px; letter-spacing: 2px">PLAY<span style="color: {{accent}}">HQ</span></span>
</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
<div style="font-size: 46px; font-weight: 700; letter-spacing: 16px; color: {{accent}}">UPDATED</div>
<div style="font-family: Anton, Impact, sans-serif; font-size: 380px; line-height: 0.95; background: linear-gradient(180deg, #fff1b8 0%, #e8c25a 45%, #a67818 100%); -webkit-background-clip: text; background-clip: text; color: transparent">TOP 4</div>
<div style="font-family: Anton, Impact, sans-serif; font-size: 150px; line-height: 1; letter-spacing: 2px">META BUILDS</div>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{guns}}" as="g" hint-placeholder-count="4">
<div style="position: relative; height: 340px; overflow: hidden; border-radius: 24px; background: linear-gradient(145deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.03) 100%); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,241,184,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), 0 12px 32px rgba(0,0,0,0.45)">
<img src="{{g.src}}" alt="{{g.name}}" style="mix-blend-mode: {{g.b}}; filter: {{g.f}}; position: absolute; left: 4%; top: 42%; width: 92%; height: auto; transform: translateY(-{{g.c}}%); -webkit-mask-image: {{g.mask}}; mask-image: {{g.mask}}">
<span style="position: absolute; left: 14px; top: 14px; width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(160deg, #fff1b8 0%, #e8c25a 45%, #a67818 100%); display: flex; align-items: center; justify-content: center; font-family: Anton, Impact, sans-serif; font-size: 42px; color: #0a0a0a">{{g.n}}</span>
<span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px; background: linear-gradient(0deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0) 100%); font-size: 32px; font-weight: 700; letter-spacing: 2px">{{g.name}}</span>
</div>
</sc-for>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 34px; align-items: center">
<div style="font-size: 40px; font-weight: 700; letter-spacing: 10px; color: {{accent}}">SWIPE FOR THE LOADOUTS  ›</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e8c25a"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#e8c25a',
guns: [
{ n: '1', name: 'HYEON BURST', src: '/_blob/475d54e47f2bc410e3a17021df3bf343', b: 'lighten', f: 'none', c: '55', mask: 'radial-gradient(ellipse 80% 22% at 50% 55%, #000 70%, transparent 100%)' },
{ n: '2', name: 'HAN 86', src: '/_blob/6604d33538c2699e263c0d83bb5b7edd', b: 'lighten', f: 'none', c: '47', mask: 'radial-gradient(ellipse 82% 75% at 50% 47%, #000 62%, transparent 100%)' },
{ n: '3', name: 'KASTOV 762', src: '/_blob/cf8f920c3df230f3b13f02470ce6e56e', b: 'lighten', f: 'none', c: '59', mask: 'radial-gradient(ellipse 80% 22% at 50% 59%, #000 70%, transparent 100%)' },
{ n: '4', name: 'ISO NIGHTSHADE', src: '/_blob/6db8aff92e5da3841c3528195f23f6b9', b: 'lighten', f: 'none', c: '55', mask: 'radial-gradient(ellipse 80% 34% at 50% 55%, #000 70%, transparent 100%)' }
]
};
}
}
</script>
</body>
</html>
